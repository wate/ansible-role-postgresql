---
- name: Find PG_VERSION files under data directory
  ansible.builtin.find:
    paths:
      - /var/lib/postgresql
    patterns: PG_VERSION
    recurse: true
  register: pg_version_files
- name: Read PG_VERSION contents
  ansible.builtin.slurp:
    path: "{{ item.path }}"
  loop: "{{ pg_version_files.files | default([]) }}"
  register: pg_version_slurps
  when: pg_version_files.matched | default(0) > 0
- name: Set detected PostgreSQL major version from PG_VERSION
  ansible.builtin.set_fact:
    postgresql_version: "{{ pg_version_slurps.results | map(attribute='content') | map('b64decode') | map('trim') | map('int') | max }}"
  when:
    - pg_version_slurps is defined
    - (pg_version_slurps.results | length) > 0
- name: Debug detected PostgreSQL version
  ansible.builtin.debug:
    msg: "Detected PostgreSQL version: {{ postgresql_version }}"
  when: postgresql_version is defined
